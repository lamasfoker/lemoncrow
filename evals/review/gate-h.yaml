# Gate H -- behavior evidence quality (plan section 19, Gate H).
#
# A LemonCrow-executed recipe or surface result may satisfy or block a
# readiness condition, or feed auto-approval, only once its recipe/surface is
# qualified on measured runs: repeat-run flake rate, base/head classification
# accuracy against labeled cases, and visual-diff determinism. Measure with
# `lc eval review gate-h run`; see docs/reference/review-evaluation.md.
#
# Readiness reads this contract through
# evidence_qualification.runtime_gate_h_config() from its PACKAGED copy,
# src/lemoncrow/pro/capabilities/review/gate_h_contract.yaml (byte-identical to
# this file; tests/gateway/test_review_gate_h_hardening.py and
# `release_gate --validate` hold them equal), so an installed wheel, the Review
# engine and the hosted server evaluate the same mode, thresholds and approval
# as a checkout. An invalid contract is report mode with the built-in defaults
# (a broken switch never enforces). Edit this file, then:
#   cp evals/review/gate-h.yaml src/lemoncrow/pro/capabilities/review/gate_h_contract.yaml
version: 1

# report: readiness is unchanged; every condition a LemonCrow-executed result
#   feeds records what enforcement would do (`evidence_qualification` on the
#   condition, outside the readiness digest).
# enforce: an unqualified or unmeasured result is shown but neither satisfies
#   nor blocks a condition, and never feeds auto-approval. Selecting enforce
#   requires product-owner-approved thresholds (as Gate I). The thresholds are
#   approved; switching readiness to enforce is a separate owner decision (the
#   evidence and recommendation: docs/reference/review-evaluation.md, "Moving
#   readiness to enforce").
mode: report

corpus: gate-h/corpus
results: gate-h/results
baseline: gate-h/baseline.json

# The floor: a repository may only tighten these in its trusted-base
# `.lemoncrow/review.yaml` under `check_policy.qualification` (`*_max` keys only
# lower, `*_min` / `min_*` keys only raise); a looser value is ignored and named.
thresholds:
  # The approval is bound to the values it approved (as Gate I's): `thresholds` is
  # what the owner approved and `thresholds_digest` its digest (`python -c` below
  # prints the new one). Editing any threshold afterwards makes the thresholds
  # unapproved again until the owner re-approves, and `mode: enforce` is refused
  # (the refusal prints both). The digest is integrity, not authorization:
  # approved_by and approved_at are free text, and whoever can edit this file can
  # write a digest; review of the commit that changes it is the authorization.
  # Recorded without changing a value: these are the thresholds approved on
  # 2026-10-06. `thresholds` must also equal the live values, or it reads unapproved.
  #   uv run python -c "from lemoncrow.pro.capabilities.review.evidence_qualification import runtime_gate_h_config as c; print(c().thresholds.digest)"
  approval:
    status: approved
    approved_by: Pankaj
    approved_at: "2026-10-06"
    thresholds:
      classification_accuracy_min: 0.95
      flake_rate_max: 0.0
      min_flake_inputs: 2
      min_labeled_units: 60
      min_render_pairs: 5
      min_runs_per_input: 10
      visual_nondeterminism_max: 0.0
    thresholds_digest: thresholds:sha256:bafae4c07df1ef32bc959c519f2f285c8c4c3fdc40415ab8fb98d36a79aa932f
  # The proposed defaults, approved by the product owner on 2026-10-06 (rationale
  # and the measured dogfood numbers: docs/reference/review-evaluation.md, "Gate H").
  flake_rate_max: 0.0               # any input whose repeat runs disagree disqualifies the recipe
  min_runs_per_input: 10            # repeat runs per fixed input before a flake rate counts
  min_flake_inputs: 2               # fixed inputs measured per recipe
  classification_accuracy_min: 0.95 # R5 classifier vs labeled ground truth, per report format
  min_labeled_units: 60             # labeled units per classifier (0 errors in 60 bounds error < 5 % at 95 %)
  visual_nondeterminism_max: 0.0    # any difference between two renders of one input disqualifies
  min_render_pairs: 5               # render pairs per surface before determinism counts
