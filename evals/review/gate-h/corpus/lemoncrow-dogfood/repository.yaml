# Gate H corpus repository: a small subset of this source checkout (dogfood).
#
# Two pinned revisions of this repository (the Wave 3 integration merge and
# its first parent), two pytest files and one vitest file, plus seeded edits
# that break one test of each. The recipes need this checkout's Python
# environment and frontend node_modules, which the bubblewrap command sandbox
# does not mount, so this corpus runs on the host executor: its environment
# class is host_unsandboxed@..., which never matches (so never qualifies) a
# sandboxed product result. It measures the recipes' flake rate on this host
# and the R5 classifier on real runner reports.
version: 1
id: lemoncrow-dogfood
description: LemonCrow review tests (2 pytest files, 1 vitest file) at two pinned revisions, with seeded failures
executor: host
runs: 10
reruns: 2

repository:
  kind: checkout
  source: "."
  revs:
    base: add4b6007cf13a69d8373dd4e6708951df8c6669
    head: 189074ae95a68d47f8cf2df7898413731dff0ad1
  paths:
    - pyproject.toml
    - src
    - tests/conftest.py
    - tests/helpers.py
    - tests/gateway/__init__.py
    - tests/gateway/conftest.py
    - tests/gateway/test_review_check_recipes.py
    - tests/gateway/test_review_ai_markers.py
    - frontend/package.json
    - frontend/index.html
    - frontend/postcss.config.js
    - frontend/tailwind.config.ts
    - frontend/tsconfig.json
    - frontend/tsconfig.node.json
    - frontend/vite.config.ts
    - frontend/vite.config.js
    - frontend/vite.config.d.ts
    - frontend/src
  commits:
    - id: seeded-pytest
      parent: head
      message: seeded introduced failure (pytest)
      edits:
        - path: tests/gateway/test_review_ai_markers.py
          old: "    assert set(divergences) == set(INTENDED)\n"
          new: "    assert set(divergences) != set(INTENDED)\n"
    - id: seeded-vitest
      parent: head
      message: seeded introduced failure (vitest)
      edits:
        - path: frontend/src/review/CheckRecipesPanel.test.tsx
          old: 'expect(api.fetchCheckRecipes).toHaveBeenCalledWith("review-1", "revision-2");'
          new: 'expect(api.fetchCheckRecipes).toHaveBeenCalledWith("review-1", "revision-9");'

host:
  # The checkout's own interpreter (its locked dependencies) and Node.
  path: [.venv/bin]
  which: [node]
  env:
    PYTHONPATH: "{tree}/src"
  links:
    frontend/node_modules: frontend/node_modules
  timeout: 600

recipes:
  - id: pytest-review-subset
    kind: test
    command: python -m pytest -q -p no:cacheprovider -o addopts= tests/gateway/test_review_check_recipes.py tests/gateway/test_review_ai_markers.py --junitxml={report}
    report: junit
  - id: vitest-check-recipes-panel
    kind: test
    cwd: frontend
    command: node_modules/.bin/vitest run src/review/CheckRecipesPanel.test.tsx --reporter=junit --outputFile={report}
    report: junit

flake:
  pytest-review-subset: [base, head]
  vitest-check-recipes-panel: [base, head]

cases:
  - id: integration-merge
    note: the merge touches neither test file nor what they test
    recipes: [pytest-review-subset, vitest-check-recipes-panel]
    base: base
    head: head
    default: unchanged
    labels:
      "@recipe": unchanged
  - id: seeded-pytest-failure
    recipes: [pytest-review-subset]
    base: head
    head: seeded-pytest
    default: unchanged
    labels:
      test_before_after_table_diverges_only_where_intended: introduced_failure
      "@recipe": introduced_failure
  - id: seeded-pytest-fixed
    recipes: [pytest-review-subset]
    base: seeded-pytest
    head: head
    default: unchanged
    labels:
      test_before_after_table_diverges_only_where_intended: fixed
      "@recipe": fixed
  - id: seeded-vitest-failure
    recipes: [vitest-check-recipes-panel]
    base: head
    head: seeded-vitest
    default: unchanged
    labels:
      "CheckRecipesPanel > raises only the deltas and counts pre-existing and quarantined results": introduced_failure
      "@recipe": introduced_failure

expectations:
  - subject: "checks.recipe:pytest-review-subset"
    expect: qualify
  - subject: "checks.recipe:vitest-check-recipes-panel"
    expect: qualify
