# Gate H corpus repository: synthetic, Apache-2.0, written for this corpus.
#
# A tiny Python project with a stdlib test runner that writes JUnit or
# jest-JSON reports (two R5 classifiers on the same tests), a recipe-level
# lint check (no report), a deliberately random recipe (coin), and two static
# pages for R7: one whose nondeterminism R7's controls freeze (Date,
# Math.random) and one they do not (performance.now, crypto.randomUUID).
# Seeded commits carry labeled ground truth for the R5 classes.
version: 1
id: synthetic-calc
description: Synthetic calculator with seeded introduced/pre-existing/fixed/new/removed/skipped/flaky cases
executor: sandbox
runs: 10
reruns: 2

repository:
  kind: synthetic
  commits:
    - id: base
      message: base
      files:
        README.md: |
          Synthetic calculator (Gate H corpus).
        src/calc.py: |
          def add(a, b):
              return a + b


          def sub(a, b):
              return a - b


          def mul(a, b):
              return a * b


          def div(a, b):
              return a / b


          def rnd(x):
              return int(x)


          def legacy():
              return "legacy"
        tests/test_calc.py: |
          import unittest

          from src import calc


          def test_add():
              assert calc.add(2, 3) == 5


          def test_sub():
              assert calc.sub(5, 3) == 2


          def test_mul():
              assert calc.mul(4, 3) == 12


          def test_div_zero():
              assert calc.div(1, 0) == 0


          def test_round():
              assert calc.rnd(2.6) == 3


          def test_legacy():
              assert calc.legacy() == "legacy"


          def test_slow_path():
              assert calc.add(0.1, 0.2) > 0.3
        run_tests.py: |
          import importlib.util
          import json
          import pathlib
          import sys
          import unittest
          from xml.sax.saxutils import quoteattr

          sys.path.insert(0, ".")
          out = pathlib.Path(sys.argv[1])
          jest = "--jest" in sys.argv
          results = []
          for path in sorted(pathlib.Path("tests").glob("test_*.py")):
              spec = importlib.util.spec_from_file_location(path.stem, path)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              for name in sorted(vars(module)):
                  if not name.startswith("test_"):
                      continue
                  try:
                      getattr(module, name)()
                      status = "passed"
                  except unittest.SkipTest:
                      status = "skipped"
                  except Exception:
                      status = "failed"
                  results.append((path.as_posix(), name, status))
          failed = sum(1 for row in results if row[2] == "failed")
          if jest:
              suites = {}
              for file, name, status in results:
                  word = {"passed": "passed", "failed": "failed", "skipped": "pending"}[status]
                  suites.setdefault(file, []).append({"fullName": name, "title": name, "status": word})
              rows = [{"name": file, "assertionResults": cases} for file, cases in suites.items()]
              out.write_text(json.dumps({"testResults": rows}))
          else:
              cases = []
              for file, name, status in results:
                  inner = {"failed": "<failure message='failed'/>", "skipped": "<skipped/>"}.get(status, "")
                  klass = quoteattr("tests." + pathlib.Path(file).stem)
                  cases.append(f"<testcase classname={klass} name={quoteattr(name)}>{inner}</testcase>")
              out.write_text("<testsuite>" + "".join(cases) + "</testsuite>")
          print(f"{len(results)} tests, {failed} failed")
          sys.exit(1 if failed else 0)
        lint.py: |
          import pathlib
          import sys

          bad = [str(path) for path in sorted(pathlib.Path("src").glob("*.py")) if "TODO" in path.read_text()]
          print("\n".join(bad) or "clean")
          sys.exit(1 if bad else 0)
        coin.py: |
          import pathlib
          import random
          import sys

          ok = random.random() < 0.5
          inner = "" if ok else "<failure message='tails'/>"
          pathlib.Path(sys.argv[1]).write_text(
              f"<testsuite><testcase classname='coin' name='toss'>{inner}</testcase></testsuite>"
          )
          sys.exit(0 if ok else 1)
        site/index.html: |
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>Orders</title>
          <style>body { font: 16px sans-serif; margin: 24px }</style></head>
          <body>
          <h1>Orders</h1>
          <p>Rendered at <span id="now"></span></p>
          <p>Lucky number <span id="rand"></span></p>
          <button aria-label="Checkout">Go</button>
          <script>
          document.getElementById("now").textContent = new Date().toISOString();
          document.getElementById("rand").textContent = String(Math.random());
          </script>
          </body></html>
        site/clock.html: |
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><title>Clock</title>
          <style>body { font: 16px sans-serif; margin: 24px }</style></head>
          <body>
          <h1>Clock</h1>
          <p>Since navigation: <span id="elapsed"></span> ms</p>
          <p>Request id: <span id="rid"></span></p>
          <script>
          document.getElementById("elapsed").textContent = String(performance.now());
          let rid = "unavailable";
          try { rid = crypto.randomUUID(); } catch (error) { rid = "no-uuid"; }
          document.getElementById("rid").textContent = rid;
          </script>
          </body></html>
    - id: introduce
      parent: base
      message: mul breaks for a > 3
      edits:
        - path: src/calc.py
          old: "    return a * b\n"
          new: "    return a * b + (1 if a > 3 else 0)\n"
    - id: fix
      parent: base
      message: round instead of truncating
      edits:
        - path: src/calc.py
          old: "    return int(x)\n"
          new: "    return round(x)\n"
    - id: fix-all
      parent: fix
      message: division by zero returns 0
      edits:
        - path: src/calc.py
          old: "    return a / b\n"
          new: "    return a / b if b else 0\n"
    - id: churn
      parent: base
      message: add a test, remove a test, skip a test
      edits:
        - path: tests/test_calc.py
          old: "def test_legacy():\n    assert calc.legacy() == \"legacy\"\n"
          new: "def test_new_feature():\n    assert calc.sub(1, 1) == 0\n"
        - path: tests/test_calc.py
          old: "    assert calc.add(0.1, 0.2) > 0.3\n"
          new: "    raise unittest.SkipTest(\"slow\")\n"
    - id: add-broken
      parent: base
      message: add a failing test
      edits:
        - path: tests/test_calc.py
          old: "def test_add():\n"
          new: "def test_new_broken():\n    assert calc.add(1, 1) == 3\n\n\ndef test_add():\n"
    - id: break-sub
      parent: base
      message: sub breaks for a > 4
      edits:
        - path: src/calc.py
          old: "    return a - b\n"
          new: "    return a - b - (1 if a > 4 else 0)\n"
    - id: noop
      parent: base
      message: docs only
      edits:
        - path: README.md
          old: "Synthetic calculator (Gate H corpus).\n"
          new: "Synthetic calculator (Gate H corpus), documented.\n"
    - id: flaky
      parent: base
      message: add a coin-flip test
      files:
        tests/test_luck.py: |
          import random


          def test_coin():
              assert random.random() < 0.5
    - id: lint-break
      parent: base
      message: leave a TODO
      edits:
        - path: src/calc.py
          old: "def legacy():\n"
          new: "# TODO: remove\ndef legacy():\n"

recipes:
  - id: py-tests
    kind: test
    command: python3 run_tests.py {report}
    report: junit
    inputs: [run_tests.py]
  - id: py-tests-jest
    kind: test
    command: python3 run_tests.py {report} --jest
    report: jest-json
    inputs: [run_tests.py]
  - id: lint
    kind: lint
    command: python3 lint.py
    inputs: [lint.py]
  - id: coin
    kind: test
    command: python3 coin.py {report}
    report: junit
    inputs: [coin.py]

# Fixed inputs each recipe is repeated on.
flake:
  py-tests: [base, introduce, fix, noop]
  py-tests-jest: [base, fix]
  lint: [base, lint-break]
  coin: [base, noop]

# Labeled ground truth. `default` labels every other unit the classifier
# reports; `@recipe` labels the recipe-level unit. Names match a test id or
# its `::name` suffix (both classifiers' ids).
cases:
  - id: introduced-failure
    recipes: [py-tests, py-tests-jest]
    base: base
    head: introduce
    default: unchanged
    labels:
      test_mul: introduced_failure
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: fixed
    recipes: [py-tests, py-tests-jest]
    base: base
    head: fix
    default: unchanged
    labels:
      test_round: fixed
      test_div_zero: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: all-fixed
    recipes: [py-tests, py-tests-jest]
    base: base
    head: fix-all
    default: unchanged
    labels:
      test_round: fixed
      test_div_zero: fixed
      "@recipe": fixed
  - id: introduced-failure-sub
    note: test_sub calls sub(5, 3); the seeded edit makes it return 1, not 2
    recipes: [py-tests, py-tests-jest]
    base: base
    head: break-sub
    default: unchanged
    labels:
      test_sub: introduced_failure
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: fixed-sub
    note: the reverse of introduced-failure-sub
    recipes: [py-tests, py-tests-jest]
    base: break-sub
    head: base
    default: unchanged
    labels:
      test_sub: fixed
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: churn
    recipes: [py-tests, py-tests-jest]
    base: base
    head: churn
    default: unchanged
    labels:
      test_new_feature: new
      test_legacy: removed
      test_slow_path: newly_skipped
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: added-failing-test
    recipes: [py-tests, py-tests-jest]
    base: base
    head: add-broken
    default: unchanged
    labels:
      test_new_broken: introduced_failure
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: no-change
    recipes: [py-tests, py-tests-jest]
    base: base
    head: noop
    default: unchanged
    labels:
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: flaky-test
    note: test_coin passes with probability 0.5; R5 reruns only a failing recipe (here always, test_div_zero fails)
    recipes: [py-tests, py-tests-jest]
    base: base
    head: flaky
    default: unchanged
    labels:
      test_coin: flaky
      test_div_zero: pre_existing_failure
      test_round: pre_existing_failure
      "@recipe": pre_existing_failure
  - id: lint-introduced
    recipes: [lint]
    base: base
    head: lint-break
    labels:
      "@recipe": introduced_failure
  - id: lint-fixed
    recipes: [lint]
    base: lint-break
    head: base
    labels:
      "@recipe": fixed
  - id: lint-clean
    recipes: [lint]
    base: base
    head: introduce
    labels:
      "@recipe": unchanged
  - id: lint-still-broken
    recipes: [lint]
    base: lint-break
    head: lint-break
    labels:
      "@recipe": pre_existing_failure

surfaces:
  - id: frozen-clock-page
    entry: visual.dom_a11y
    input: base
    pairs: 5
    render:
      static_root: site
      routes: ["/"]
  - id: performance-clock-page
    entry: visual.dom_a11y
    input: base
    pairs: 5
    render:
      static_root: site
      routes: ["/clock.html"]

# What each subject is for. `qualify` counts as qualifying evidence; `advisory` and
# `negative_control` must stay advisory for exactly the named reason (a negative control
# that starts to qualify, or is disqualified for another reason, is a violation
# `gate-h report` names; it is never counted as qualifying evidence).
expectations:
  - subject: "checks.recipe:py-tests"
    expect: qualify
  - subject: "checks.recipe:py-tests-jest"
    expect: qualify
  - subject: "checks.recipe:lint"
    expect: advisory
    reason: insufficient_measurement
    why: >-
      A recipe-level classifier (no report format) yields one labeled unit per base/head
      pair, so the 60-unit floor needs 60 distinct seeded pairs. This project has four
      honest ones (introduced, fixed, clean, still broken); padding with relabeled copies
      would qualify lint without measuring anything new. It stays advisory until a corpus
      with real lint history exists.
  - subject: "checks.recipe:coin"
    expect: negative_control
    reason: flaky
    why: coin.py passes with probability 0.5; the flake measurement must reject it.
  - subject: "surface:frozen-clock-page"
    expect: qualify
  - subject: "surface:performance-clock-page"
    expect: negative_control
    reason: visual_nondeterministic
    why: >-
      performance.now() and crypto.randomUUID() change on every render and R7's controls
      do not freeze them; the render-pair measurement must reject it.
