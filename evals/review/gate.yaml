# Gate I -- review-system regression gate (Phase 13 item 9).
#
# Before a model, prompt, policy-default or preset change ships, replay the
# corpus (lc eval review gate). The gate compares every selection with
# baseline.json and blocks when catch rate drops, a catch is lost, noise rises
# or cost per weighted catch (compute minutes, model calls, known dollars)
# rises beyond the thresholds below, unless an authorized owner's acceptance
# record (acceptances/*.yaml, lc eval review accept) names the exact measured
# numbers. Absolute cost per Review is reported, never gated by itself. See
# docs/reference/review-evaluation.md.
version: 1

# report: every result is printed, nothing blocks (exit 0).
# enforce: anything but pass/accepted fails (exit 1). Selecting enforce here
# requires product-owner-approved thresholds. CI runs report mode; the release
# gate (`make release-gate`) runs `--mode enforce` on the command line.
mode: report

corpus: corpus/builtin
baseline: baseline.json
acceptances: acceptances

replay:
  # The reviewer identity the fixtures were recorded with. The built-in
  # fixtures are authored by the deterministic scripted reviewer (record
  # --synthetic), which measures the pipeline -- planning, budgets, candidate
  # selection, validation, matching -- not a model. Changing this to a real
  # model is a model change: re-record with --live (budget-capped) and gate it.
  reviewer:
    driver: openai
    model: synthetic-reviewer-v1
  selections:
    - quick
    - auto
    - thorough
    - deep
    - name: static-only
      custom_from: quick
      custom:
        - side_effects.static

thresholds:
  # Approval is bound to the values below: approving sets status: approved,
  # approved_by, approved_at, thresholds (every value approved) and
  # thresholds_digest (their digest; the enforce refusal prints both). Editing
  # any threshold or weight afterwards makes them unapproved again.
  approval:
    status: approved
    approved_by: Pankaj
    approved_at: "2026-10-06"
    thresholds:
      behavior_catch_rate_drop_max: 0.0
      behavior_catch_weight: 1.0
      catch_rate_drop_max: 0.0
      cost_per_catch_rise_max: 0.1
      defect_catch_weight: 1.0
      lost_catches_max: 0
      noise_rate_rise_max: 0.05
    thresholds_digest: c6b9884753d738ca912f4f901def0143943204da0de206eafc5e0bb918c91d9b
  # The proposed defaults, approved by the product owner on 2026-10-06.
  catch_rate_drop_max: 0.0           # any drop in a selection's catch rate blocks
  behavior_catch_rate_drop_max: 0.0  # any drop in its behavior-delta catch rate blocks
  lost_catches_max: 0                # any previously caught expectation now missed blocks
  noise_rate_rise_max: 0.05          # noise may rise by at most 5 points
  # Cost per weighted catch may rise by at most 10 %, separately in planned
  # compute minutes, model calls and (when every call reported USD) provider
  # dollars. Cost with no catch, a rise from zero and unknown cost block.
  cost_per_catch_rise_max: 0.10
  defect_catch_weight: 1.0           # weighted catches = defects x this + behavior catches x the next
  behavior_catch_weight: 1.0

# Who may accept a measured trade-off (named by the product owner, 2026-10-06).
authorized_owners:
  - Pankaj
