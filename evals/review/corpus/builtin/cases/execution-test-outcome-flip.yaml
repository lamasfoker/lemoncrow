id: execution-test-outcome-flip
title: Runtime test outcome changes without a failing command
kind: defect
provenance:
  source: synthetic
  note: Authored for Gate I execution-fixture coverage; contains no third-party code.
license: Apache-2.0
base:
  src/feature.py: |
    def enabled() -> bool:
        return True
  tests/test_feature.py: |
    from src.feature import enabled

    def test_feature_enabled() -> None:
        assert enabled()
head:
  src/feature.py: |
    def enabled() -> bool:
        return False
expected:
  findings: []
  behavior:
    - id: passing-test-is-skipped
      kind: test_outcome
      subject: "pytest::*test_feature_enabled*"
      selections: [thorough, deep]
      change: changed
execution:
  checks.test:
    old:
      status: passed
      report: '<testsuite><testcase classname="tests.test_feature" name="test_feature_enabled" file="tests/test_feature.py"/></testsuite>'
    new:
      status: passed
      report: '<testsuite><testcase classname="tests.test_feature" name="test_feature_enabled" file="tests/test_feature.py"><skipped/></testcase></testsuite>'
  behavior.test_diff:
    old:
      status: passed
      report: '<testsuite><testcase classname="tests.test_feature" name="test_feature_enabled" file="tests/test_feature.py"/></testsuite>'
    new:
      status: passed
      report: '<testsuite><testcase classname="tests.test_feature" name="test_feature_enabled" file="tests/test_feature.py"><skipped/></testcase></testsuite>'
  side_effects.runtime:
    old: {status: passed, observation: {version: 1, side: old, tier: hooks, effects: [], query_count: 0, trace: [], trace_supported: true, truncated: false}}
    new: {status: passed, observation: {version: 1, side: new, tier: hooks, effects: [], query_count: 0, trace: [], trace_supported: true, truncated: false}}
