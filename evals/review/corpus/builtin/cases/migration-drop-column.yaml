id: migration-drop-column
title: A migration drops a column without a backfill
kind: defect
provenance:
  source: synthetic
  note: >-
    Authored for the LemonCrow Review evaluation harness; contains no
    third-party code. Static analysis reports the destructive drop; the
    "migration" and ".sql" markers make the file an AI candidate (before they
    could match real paths the AI finding was missed at every depth).
license: Apache-2.0
base:
  migrations/0001_init.sql: |
    CREATE TABLE users (
        id INTEGER PRIMARY KEY,
        email TEXT NOT NULL
    );
head:
  migrations/0002_drop_email.sql: |
    ALTER TABLE users DROP COLUMN email;
expected:
  findings:
    - id: destructive-drop
      path: migrations/0002_drop_email.sql
      line: 1
      category: persistence_migration
      severity: p1
  behavior:
    - id: drops-users-email
      kind: side_effect
      subject: "db_drop:*drop_column:users.email"
      change: added
    - id: new-migration
      kind: side_effect
      subject: "migration:migrations/0002_drop_email.sql"
      change: added
synthetic_reviewer:
  confirm:
    - path: migrations/0002_drop_email.sql
      category: persistence_migration
      title: Migration irreversibly drops users.email
      explanation: The migration drops a NOT NULL column with no copy or down migration.
      consequence: Every stored email address is lost on deploy and cannot be rolled back.
execution:
  migrations.execute:
    default:
      status: passed
      report:
        dialect: sqlite
        schema_before:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
              - {name: email, type: TEXT}
        schema_after:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
        migrations:
          - id: 0002_drop_email
            paths: [0002_drop_email.sql]
            state: added
            up: "ALTER TABLE users DROP COLUMN email;"
  compat.mixed_version:
    default:
      status: passed
      report:
        schema_old:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
              - {name: email, type: TEXT}
        schema_new:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
        applied: [0002_drop_email]
        probes: {old: [], new: []}
