id: worker-lock-removed
title: A shared counter loses its lock
kind: defect
provenance:
  source: synthetic
  note: Authored for the LemonCrow Review evaluation harness; contains no third-party code.
license: Apache-2.0
base:
  src/jobs/worker.py: |
    """Background job worker."""

    import threading


    class Counter:
        def __init__(self) -> None:
            self._lock = threading.Lock()
            self.processed = 0

        def record(self) -> None:
            with self._lock:
                self.processed += 1
head:
  src/jobs/worker.py: |
    """Background job worker."""

    import threading


    class Counter:
        def __init__(self) -> None:
            self._lock = threading.Lock()
            self.processed = 0

        def record(self) -> None:
            self.processed += 1
expected:
  findings:
    - id: unlocked-increment
      path: src/jobs/worker.py
      line: 12
      category: concurrency_state
      severity: p1
synthetic_reviewer:
  confirm:
    - path: src/jobs/worker.py
      category: concurrency_state
      title: Concurrent record() calls lose increments
      explanation: record() updates processed without the lock that __init__ still creates for it.
      consequence: Worker threads overwrite each other's counts under load.
