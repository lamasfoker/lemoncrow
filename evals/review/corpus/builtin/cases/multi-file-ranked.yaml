id: multi-file-ranked
title: The real defect sits in the lowest-ranked AI candidate
kind: defect
provenance:
  source: synthetic
  note: >-
    Authored for the LemonCrow Review evaluation harness; contains no
    third-party code. Measures how deep the AI stage reaches: of the four
    changed files, three become AI candidates (security, persistence,
    performance) and the defect is the lowest-ranked one, so only depths that
    investigate three or more hypotheses can catch it.
license: Apache-2.0
base:
  src/auth/audit.py: |
    """Audit log helpers."""


    def audit_message(actor: str, action: str) -> str:
        return f"{actor} performed {action}"
  src/storage/schema.py: |
    """Table names."""

    USERS_TABLE = "users"
  src/api/routes.py: |
    """Route table."""

    ROUTES = {"/health": "health"}
  src/search/query.py: |
    """Search listing."""


    def list_results(rows: list[str], page: int, size: int = 50) -> list[str]:
        start = page * size
        return rows[start : start + size]
head:
  src/auth/audit.py: |
    """Audit log helpers."""


    def audit_message(actor: str, action: str) -> str:
        return f"{actor} did {action}"
  src/storage/schema.py: |
    """Table names used by the application."""

    USERS_TABLE = "users"
  src/api/routes.py: |
    """Route table."""

    ROUTES = {"/health": "health", "/ready": "ready"}
  src/search/query.py: |
    """Search listing."""


    def list_results(rows: list[str], page: int, size: int = 50) -> list[str]:
        return rows
expected:
  findings:
    - id: pagination-dropped
      path: src/search/query.py
      line: 5
      category: performance
      severity: p2
synthetic_reviewer:
  confirm:
    - path: src/search/query.py
      category: performance
      title: list_results ignores page and size
      explanation: The pagination slice was removed, so every call returns all rows.
      consequence: Large result sets are returned whole on every page request.
