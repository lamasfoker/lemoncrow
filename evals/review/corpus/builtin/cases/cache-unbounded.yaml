id: cache-unbounded
title: A lookup cache loses its size bound
kind: defect
provenance:
  source: synthetic
  note: Authored for the LemonCrow Review evaluation harness; contains no third-party code.
license: Apache-2.0
base:
  src/catalog/cache.py: |
    """Product lookup cache."""

    from functools import lru_cache


    @lru_cache(maxsize=1024)
    def product_name(product_id: int) -> str:
        return f"product-{product_id}"
head:
  src/catalog/cache.py: |
    """Product lookup cache."""

    from functools import lru_cache


    @lru_cache(maxsize=None)
    def product_name(product_id: int) -> str:
        return f"product-{product_id}"
expected:
  findings:
    - id: unbounded-cache
      path: src/catalog/cache.py
      line: 6
      category: performance
      severity: p2
synthetic_reviewer:
  confirm:
    - path: src/catalog/cache.py
      category: performance
      title: Product cache grows without bound
      explanation: lru_cache(maxsize=None) keeps every product id ever requested.
      consequence: Memory grows with the product id space until the process is killed.
