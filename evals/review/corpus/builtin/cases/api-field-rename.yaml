id: api-field-rename
title: A public API response field is renamed
kind: defect
provenance:
  source: synthetic
  note: >-
    Authored for the LemonCrow Review evaluation harness; contains no
    third-party code. The "/api/" path-segment marker makes it an AI
    candidate; before that marker could match real paths it was missed at
    every depth.
license: Apache-2.0
base:
  src/api/serializers.py: |
    """Public API response serialization."""


    def user_payload(user):
        return {
            "user_id": user.id,
            "name": user.name,
        }
head:
  src/api/serializers.py: |
    """Public API response serialization."""


    def user_payload(user):
        return {
            "userId": user.id,
            "name": user.name,
        }
expected:
  findings:
    - id: renamed-field
      path: src/api/serializers.py
      line: 6
      category: api_compatibility
      severity: p1
synthetic_reviewer:
  confirm:
    - path: src/api/serializers.py
      category: api_compatibility
      title: Response field user_id renamed to userId
      explanation: user_payload() no longer emits user_id, which existing clients read.
      consequence: Every client that reads user_id breaks on deploy.
