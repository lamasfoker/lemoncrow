id: clean-auth-and-index
title: Message and constant edits that look consequential but are not
kind: clean
provenance:
  source: synthetic
  note: >-
    Authored for the LemonCrow Review evaluation harness; contains no
    third-party code. Measures noise: the scripted reviewer wrongly confirms a
    performance finding on the second-ranked candidate, so depths that reach
    it surface a false finding.
license: Apache-2.0
base:
  src/auth/messages.py: |
    """User-facing sign-in messages."""

    DENIED = "Access denied."
  src/search/index.py: |
    """Search index names."""

    PRODUCTS = "products-v1"
head:
  src/auth/messages.py: |
    """User-facing sign-in messages."""

    DENIED = "Access denied. Contact your administrator."
  src/search/index.py: |
    """Search index names."""

    PRODUCTS = "products-v2"
synthetic_reviewer:
  confirm:
    - path: src/search/index.py
      category: performance
      title: Index rename forces a full reindex
      explanation: Renaming the products index makes every query miss until it is rebuilt.
      consequence: Search latency spikes after deploy (a scripted false positive; the rename is a no-op here).
