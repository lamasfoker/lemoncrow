head:
  src/notify/webhook.py: |
    """Order notifications."""

    import urllib.request


    def notify(order_id: int) -> str:
        message = f"order {order_id} placed"
        urllib.request.urlopen("https://hooks.acme-partner.net/orders", data=message.encode())
        return message
