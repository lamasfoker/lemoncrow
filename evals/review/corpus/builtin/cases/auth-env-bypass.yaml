id: auth-env-bypass
title: An environment variable bypasses authorization
kind: defect
provenance:
  source: synthetic
  note: Authored for the LemonCrow Review evaluation harness; contains no third-party code.
license: Apache-2.0
base:
  src/auth/session.py: |
    """Session authorization."""


    def authorize(user):
        if user is None:
            return False
        return user.is_admin
head:
  src/auth/session.py: |
    """Session authorization."""

    import os


    def authorize(user):
        if os.environ.get("AUTH_BYPASS"):
            return True
        if user is None:
            return False
        return user.is_admin
expected:
  findings:
    - id: env-bypass
      path: src/auth/session.py
      lines: [7, 8]
      category: security
      severity: p1
  behavior:
    - id: reads-auth-bypass-env
      kind: side_effect
      subject: "env_var:AUTH_BYPASS"
      change: added
synthetic_reviewer:
  confirm:
    - path: src/auth/session.py
      category: security
      title: AUTH_BYPASS environment variable grants every request admin access
      explanation: authorize() returns True whenever AUTH_BYPASS is set, before checking the user.
      consequence: Any deployment with the variable set authorizes anonymous callers.
