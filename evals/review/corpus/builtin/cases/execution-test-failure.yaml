id: execution-test-failure
title: A code change makes an existing test fail
kind: defect
provenance:
  source: synthetic
  note: Authored for Gate I execution-fixture coverage; contains no third-party code.
license: Apache-2.0
base:
  src/checkout.py: |
    def discount(total: int) -> int:
        return total // 10
  tests/test_checkout.py: |
    from src.checkout import discount

    def test_discount() -> None:
        assert discount(100) == 10
head:
  src/checkout.py: |
    def discount(total: int) -> int:
        return 0
expected:
  findings: []
  behavior:
    - id: checks-test-fails
      kind: test_outcome
      subject: "checks.test:FAIL"
      change: changed
      selections: [quick, auto, thorough, deep]
    - id: existing-test-now-fails
      kind: test_outcome
      subject: "pytest::*test_discount*"
      selections: [auto, thorough, deep]
      change: changed
execution:
  checks.test:
    old:
      status: passed
      report: '<testsuite><testcase classname="tests.test_checkout" name="test_discount" file="tests/test_checkout.py"/></testsuite>'
    new:
      status: failed
      exit_code: 1
      report: '<testsuite><testcase classname="tests.test_checkout" name="test_discount" file="tests/test_checkout.py"><failure message="assertion failed"/></testcase></testsuite>'
  behavior.test_diff:
    old:
      status: passed
      report: '<testsuite><testcase classname="tests.test_checkout" name="test_discount" file="tests/test_checkout.py"/></testsuite>'
    new:
      status: failed
      exit_code: 1
      report: '<testsuite><testcase classname="tests.test_checkout" name="test_discount" file="tests/test_checkout.py"><failure message="assertion failed"/></testcase></testsuite>'
  side_effects.runtime:
    old: {status: passed, observation: {version: 1, side: old, tier: hooks, effects: [], query_count: 0, trace: [], trace_supported: true, truncated: false}}
    new: {status: passed, observation: {version: 1, side: new, tier: hooks, effects: [], query_count: 0, trace: [], trace_supported: true, truncated: false}}
