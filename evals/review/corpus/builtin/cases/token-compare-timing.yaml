id: token-compare-timing
title: Token comparison loses its constant-time check
kind: defect
provenance:
  source: synthetic
  note: Authored for the LemonCrow Review evaluation harness; contains no third-party code.
license: Apache-2.0
base:
  src/auth/tokens.py: |
    """API token verification."""

    import hmac


    def verify_token(presented: str, expected: str) -> bool:
        return hmac.compare_digest(presented.encode(), expected.encode())
head:
  src/auth/tokens.py: |
    """API token verification."""


    def verify_token(presented: str, expected: str) -> bool:
        return presented == expected
expected:
  findings:
    - id: timing-compare
      path: src/auth/tokens.py
      line: 5
      category: security
      severity: p1
synthetic_reviewer:
  confirm:
    - path: src/auth/tokens.py
      category: security
      title: Token check is no longer constant-time
      explanation: verify_token() compares secrets with ==, which returns early on the first differing byte.
      consequence: An attacker can recover a valid token byte by byte from response timing.
