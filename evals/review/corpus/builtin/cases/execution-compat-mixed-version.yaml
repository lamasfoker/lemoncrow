id: execution-compat-mixed-version
title: Old code breaks against a migrated schema during a rolling deploy
kind: defect
provenance:
  source: synthetic
  note: Authored for Gate I execution-fixture coverage; contains no third-party code.
license: Apache-2.0
review_config: |
  ai_content_access:
    - mode: ai_denied
      paths: ['**/*.sql']
base:
  db/migrations/0001_init.up.sql: |
    CREATE TABLE users (
        id INTEGER PRIMARY KEY,
        email TEXT NOT NULL,
        legacy TEXT
    );
  app/db.py: |
    def load(db, user_id):
        return db.execute("SELECT id, email, legacy FROM users WHERE id = ?", (user_id,)).fetchone()
head:
  db/migrations/0002_drop_legacy.up.sql: |
    ALTER TABLE users DROP COLUMN legacy;
  app/db.py: |
    def load(db, user_id):
        return db.execute("SELECT id, email FROM users WHERE id = ?", (user_id,)).fetchone()
expected:
  findings: []
  behavior:
    - id: old-code-new-schema-incompatible
      kind: compatibility
      subject: "compat.mixed_version:*::old_code_new_schema::old_statement_fails::*"
      selections: [deep]
execution:
  migrations.execute:
    default:
      status: passed
      report:
        dialect: sqlite
        schema_before:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
              - {name: email, type: TEXT, notnull: true}
              - {name: legacy, type: TEXT}
        schema_after:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
              - {name: email, type: TEXT, notnull: true}
        migrations:
          - id: 0002_drop_legacy
            paths: [0002_drop_legacy.up.sql]
            state: added
            up: "ALTER TABLE users DROP COLUMN legacy;"
        applied: [0002_drop_legacy]
        rollback: {status: skipped}
  compat.mixed_version:
    default:
      status: passed
      report:
        schema_old:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
              - {name: email, type: TEXT, notnull: true}
              - {name: legacy, type: TEXT}
        schema_new:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER}
              - {name: email, type: TEXT, notnull: true}
        applied: [0002_drop_legacy]
        probes:
          old:
            - {k: o1, on_old: "", on_new: "no such column: legacy"}
          new:
            - {k: n1, on_old: "", on_new: ""}
