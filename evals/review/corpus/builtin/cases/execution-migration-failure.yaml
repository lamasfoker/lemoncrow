id: execution-migration-failure
title: A migration fails when applied to the trusted base
kind: defect
provenance:
  source: synthetic
  note: Authored for Gate I execution-fixture coverage; contains no third-party code.
license: Apache-2.0
review_config: |
  ai_content_access:
    - mode: ai_denied
      paths: ['**/*.sql']
base:
  db/migrations/0001_init.sql: |
    CREATE TABLE users (
        id INTEGER PRIMARY KEY,
        email TEXT NOT NULL
    );
head:
  db/migrations/0002_bad.sql: |
    ALTER TABLE users ADD COLUMN ;
expected:
  findings: []
  behavior:
    - id: migration-does-not-apply
      kind: migration
      subject: "migrations.execute:*::apply"
      selections: [deep]
execution:
  migrations.execute:
    new:
      status: failed
      exit_code: 1
      report:
        exit: 1
        dialect: sqlite
        schema_before:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER, pk: true}
              - {name: email, type: TEXT, notnull: true}
        schema_after:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER, pk: true}
              - {name: email, type: TEXT, notnull: true}
        migrations:
          - id: 0002_bad
            paths: [0002_bad.sql]
            state: added
            up: "ALTER TABLE users ADD COLUMN ;"
        failed: {id: 0002_bad, error: "near ';': syntax error"}
        rollback: {status: skipped}
  compat.mixed_version:
    new:
      status: passed
      exit_code: 0
      report:
        exit: 0
        schema_old:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER, pk: true}
              - {name: email, type: TEXT, notnull: true}
        schema_new:
          "table:users":
            kind: table
            name: users
            columns:
              - {name: id, type: INTEGER, pk: true}
              - {name: email, type: TEXT, notnull: true}
        applied: []
        probes: {old: [], new: []}
