id: test-skip-weakening
title: A failing test is skipped instead of fixed
kind: defect
provenance:
  source: synthetic
  note: Authored for the LemonCrow Review evaluation harness; contains no third-party code.
license: Apache-2.0
base:
  src/billing/totals.py: |
    """Invoice totals."""


    def total(amounts: list[int]) -> int:
        return sum(amounts)
  tests/test_totals.py: |
    from src.billing.totals import total


    def test_total_adds_amounts() -> None:
        assert total([1, 2, 3]) == 6
head:
  tests/test_totals.py: |
    import pytest

    from src.billing.totals import total


    @pytest.mark.skip(reason="flaky")
    def test_total_adds_amounts() -> None:
        assert total([1, 2, 3]) == 6
