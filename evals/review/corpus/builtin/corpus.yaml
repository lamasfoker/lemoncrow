# Built-in public Review evaluation corpus (Phase 13 item 9).
# Every case is synthetic, authored for this repository, Apache-2.0, and states
# its provenance and license in its own file. Organization corpora are never
# added here: they need an explicit opt-in and must live outside this checkout.
id: builtin-public
version: 1
visibility: public
license: Apache-2.0
description: >-
  Small synthetic Changes with known defects, known behavior deltas and
  known-clean Changes, sized for CI replay from recorded fixtures.
line_tolerance: 3
cases:
  - auth-env-bypass
  - token-compare-timing
  - cache-unbounded
  - api-field-rename
  - worker-lock-removed
  - migration-drop-column
  - multi-file-ranked
  - outbound-host-added
  - test-skip-weakening
  - execution-test-failure
  - execution-test-outcome-flip
  - execution-runtime-network
  - execution-migration-failure
  - execution-compat-mixed-version
  - clean-local-rename
  - clean-auth-and-index
